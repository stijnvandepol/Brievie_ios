generate:
  - types
  - client
accessModifier: public
namingStrategy: idiomatic
# Only the operations the app calls; add an operation here when a feature starts using it.
filter:
  operations:
    - getHealth
    - getCaCertificate
    - pairDevice
    - createPairingChallenge
    - pairDeviceWithProof
    - revokeDevice
    - listWorkspaces
    - listDocuments
    - getInboxCounts
    - getDocument
    - searchDocuments
    - getDocumentPage
    - confirmDocument
    - retryDocumentProcessing
    - listPersons
    - createPerson
    - listLabels
    - setDocumentAddressees
    - setDocumentLabels
    - acceptSuggestion
    - dismissSuggestion
    - listTasks
    - completeTask
    - reopenTask
    # Mijn taken (host PR #36)
    - listMyTasks
    - countMyTasks
    - assignTask
    - listTaskAssignees
    - setTaskDeadline
    - getMe
    - trashDocument
    - restoreDocument
    - listTrash
    - listDuplicates
    - getDuplicate
    - mergeDuplicate
    - dismissDuplicate
    # Navigation and Mijn post (host PR #44)
    - getMenuCounts
    - markDocumentRead
    - markDocumentUnread
    - markDocumentsRead
    - listLingeringLetters
    # Letter status (host PR #50)
    - countLetterStatuses
    - handleDocument
    - setTaskWaiting
    - snoozeTask
    # External access (host PR #53)
    - getServerAddresses
  # The JSON inside the `metadata` field of the multipart upload (createDocument), which the
  # app sends through a background URLSession, not through the generated client.
  schemas:
    - UploadMetadataIn
