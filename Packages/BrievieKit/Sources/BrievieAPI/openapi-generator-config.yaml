generate:
  - types
  - client
accessModifier: public
namingStrategy: idiomatic
# Only the operations the app calls; add an operation here when a feature starts using it.
filter:
  operations:
    - getHealth
    - getCaCertificate
    - pairDevice
    - revokeDevice
    - listWorkspaces
    - listDocuments
    - getDocument
    - getDocumentPage
    - confirmDocument
    - retryDocumentProcessing
    - listPersons
    - createPerson
    - listLabels
    - setDocumentAddressees
    - setDocumentLabels
    - acceptSuggestion
    - dismissSuggestion
    - listTasks
    - completeTask
    - reopenTask
  # The JSON inside the `metadata` field of the multipart upload (createDocument), which the
  # app sends through a background URLSession, not through the generated client.
  schemas:
    - UploadMetadataIn
