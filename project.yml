name: Brievie
# `Base.xcconfig` sets the developer team; the optional, git-ignored `Local.xcconfig` overrides it (see
# `Local.xcconfig.example`).
configFiles:
  Debug: Base.xcconfig
  Release: Base.xcconfig
options:
  bundleIdPrefix: nl.stijnvdpol
  developmentLanguage: nl
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: false
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  BrievieKit:
    path: Packages/BrievieKit
targets:
  Brievie:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.stijnvdpol.brievie
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: BrievieKit
        products:
          - BrievieAPI
          - BrievieCore
          - BrievieUI
          - FeaturePairing
          - FeatureWorkspace
  # Tests that need an entitled app process (the Keychain). Hosted in the app on the simulator.
  BrievieTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Packages/BrievieKit/Tests/BrievieCoreTests/KeychainSecretStoreTests.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.stijnvdpol.brievie.tests
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) BRIEVIE_HOSTED_TESTS
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Brievie.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Brievie
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: Brievie
schemes:
  Brievie:
    build:
      targets:
        Brievie: all
    test:
      targets:
        - BrievieTests
    archive:
      config: Release
