name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: brew install xcodegen swiftlint
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Project matches project.yml
        run: make check-project
      - name: Pick a simulator
        run: |
          udid=$(scripts/simulator-udid.sh "iPhone 17")
          echo "SIMULATOR_ID=$udid" >> "$GITHUB_ENV"
      - name: Simulator build
        run: make build
      - name: Keychain tests (hosted in the app on the simulator)
        run: make test-keychain

  secrets:
    runs-on: ubuntu-latest
    # gitleaks-action lists the pull request's commits.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
