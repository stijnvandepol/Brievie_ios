name: Feature
description: Suggest something the app could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What do you want to do that you cannot do now?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could the app solve it? Does it need a change in the server too?
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now instead
